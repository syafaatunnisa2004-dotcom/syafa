<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bintang 8A | Portal PAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EFF3F7;--sf:#FFFFFF;--sf2:#F5F8FB;--ink:#131A45;--mut:#586187;--line:#D9E0EA;
  --brand:#1B2A7A;--onbrand:#FFFFFF;--tq:#0B8F8A;--tqbg:#DCF3F1;--gold:#F2B233;--goldbg:#FFF0CC;
  --rose:#C2334F;--rosebg:#FBE3E8;--ok:#1B8253;--okbg:#DBF2E5;--hero:#17206A;
  --fd:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--fb:'Figtree','Segoe UI',system-ui,sans-serif;--fa:'Amiri','Traditional Arabic',serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1030;--sf:#131A47;--sf2:#182052;--ink:#ECF0FF;--mut:#9BA4D2;--line:#28316B;
    --brand:#8AA0FF;--onbrand:#0B1030;--tq:#3DD3CA;--tqbg:#0F3A4C;--gold:#F5C04E;--goldbg:#3B3218;
    --rose:#FF7C95;--rosebg:#40202E;--ok:#5FD497;--okbg:#153A2C;--hero:#1A2472;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1030;--sf:#131A47;--sf2:#182052;--ink:#ECF0FF;--mut:#9BA4D2;--line:#28316B;
  --brand:#8AA0FF;--onbrand:#0B1030;--tq:#3DD3CA;--tqbg:#0F3A4C;--gold:#F5C04E;--goldbg:#3B3218;
  --rose:#FF7C95;--rosebg:#40202E;--ok:#5FD497;--okbg:#153A2C;--hero:#1A2472;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.55}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--fd);margin:0;line-height:1.12;letter-spacing:-.01em}
p{margin:0}
.ar{font-family:var(--fa);direction:rtl;text-align:right;line-height:2.1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Login ---------- */
.login{min-height:100%;display:grid;grid-template-columns:1.05fr 1fr}
.art{position:relative;overflow:hidden;background:var(--hero);color:#fff;display:flex;align-items:flex-end;padding:48px}
.art .lattice{position:absolute;inset:0;opacity:.16}
.art .spin{position:absolute;left:50%;top:44%;width:min(78%,560px);aspect-ratio:1;transform:translate(-50%,-50%)}
.art .spin svg{position:absolute;inset:0;width:100%;height:100%}
.art .s1{animation:rot 90s linear infinite}
.art .s2{animation:rot 140s linear infinite reverse}
@keyframes rot{to{transform:rotate(360deg)}}
.art .big{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-family:var(--fd);font-weight:800;font-size:clamp(84px,14vw,168px);letter-spacing:-.05em;color:#fff;line-height:1}
.art .cap{position:relative;max-width:420px}
.art .cap h1{font-size:clamp(28px,3.2vw,40px);font-weight:700}
.art .cap p{margin-top:10px;color:#C9D1FF;max-width:36ch}
.panel{display:flex;flex-direction:column;justify-content:center;padding:48px clamp(24px,6vw,84px);background:var(--bg)}
.panel h2{font-size:32px;font-weight:700}
.panel .lead{color:var(--mut);margin-top:8px;max-width:44ch}
.field{margin-top:20px;display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:15px}
.field input{height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--sf);padding:0 16px;font-size:17px}
.field input:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 20%,transparent)}
.field small{color:var(--mut)}
.err{min-height:24px;margin-top:12px;color:var(--rose);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 24px;border-radius:14px;border:0;background:var(--brand);color:var(--onbrand);font-weight:700;font-size:16px;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.gold{background:var(--gold);color:#241A00}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--line)}
.btn.sm{height:38px;padding:0 16px;font-size:14px;border-radius:11px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.roster{margin-top:22px;border:1px solid var(--line);border-radius:16px;background:var(--sf);padding:4px 16px}
.roster summary{cursor:pointer;padding:12px 0;font-weight:600}
.roster .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:4px;padding-bottom:12px;max-height:240px;overflow:auto}
.roster button{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:8px;font-size:14px}
.roster button:hover{background:var(--sf2)}
.roster b{min-width:26px;color:var(--brand)}
.hint{margin-top:14px;font-size:14px;color:var(--mut)}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;height:100dvh;background:var(--hero);color:#fff;display:flex;flex-direction:column;padding:22px 14px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px}
.brand svg{width:34px;height:34px;flex:none}
.brand b{font-family:var(--fd);font-size:20px;letter-spacing:-.02em}
.brand span{display:block;font-size:12px;color:#B7C1FF;line-height:1.2}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;height:46px;padding:0 14px;border:0;border-radius:13px;background:transparent;color:#D5DBFF;font-weight:600;text-align:left}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button[aria-current="page"]{background:var(--gold);color:#241A00}
.side .me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.14)}
.side .me .nm{font-weight:700;font-size:14px;line-height:1.25}
.side .me .sb{font-size:12px;color:#B7C1FF}
.av{width:38px;height:38px;border-radius:50%;background:var(--gold);color:#241A00;display:grid;place-items:center;font-weight:800;flex:none;font-family:var(--fd)}
.iconbtn{margin-left:auto;background:transparent;border:0;color:#D5DBFF;padding:8px;border-radius:10px}
.iconbtn:hover{background:rgba(255,255,255,.1)}
.main{padding:28px clamp(18px,3.4vw,44px) 56px;min-width:0;max-width:1180px;width:100%}
.top{display:flex;align-items:center;gap:14px;margin-bottom:24px;flex-wrap:wrap}
.top h1{font-size:clamp(26px,3vw,34px);font-weight:700;flex:1;min-width:180px}
.chip{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:99px;background:var(--sf);border:1px solid var(--line);font-size:14px;font-weight:600}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--tq);display:block}
.tabbar{display:none}

/* ---------- Generic ---------- */
.card{background:var(--sf);border:1px solid var(--line);border-radius:20px;padding:22px}
.card h3{font-size:19px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.mut{color:var(--mut)}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.stack>*+*{margin-top:12px}
.pill{display:inline-flex;align-items:center;height:26px;padding:0 11px;border-radius:99px;font-size:13px;font-weight:700;background:var(--sf2);color:var(--mut)}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.warn{background:var(--goldbg);color:#8A5A00}
:root[data-theme="dark"] .pill.warn{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.warn{color:var(--gold)}}
.pill.bad{background:var(--rosebg);color:var(--rose)}
.pill.info{background:var(--tqbg);color:var(--tq)}
.empty{padding:26px;text-align:center;color:var(--mut);border:1.5px dashed var(--line);border-radius:16px}
.back{background:transparent;border:0;color:var(--brand);font-weight:700;padding:6px 0;margin-bottom:14px;display:inline-flex;gap:6px;align-items:center}

/* hero */
.hero{position:relative;overflow:hidden;background:var(--hero);color:#fff;border-radius:30px;padding:34px clamp(22px,4vw,44px);display:grid;grid-template-columns:1fr 250px;gap:24px;align-items:center;margin-bottom:22px}
.hero h2{font-size:clamp(30px,4.2vw,50px);font-weight:800;letter-spacing:-.03em}
.hero p{color:#C9D1FF;margin-top:10px;max-width:46ch}
.hero .facts{display:flex;flex-wrap:wrap;gap:8px 26px;margin-top:22px}
.hero .facts div{font-size:13px;color:#B7C1FF}
.hero .facts b{display:block;font-family:var(--fd);font-size:24px;color:#fff;letter-spacing:-.02em}
.starbox{position:relative;width:100%;max-width:250px;aspect-ratio:1;margin-inline:auto}
.starbox svg{width:100%;height:100%;overflow:visible}
.starbox .ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.starbox .ctr b{font-family:var(--fd);font-weight:800;font-size:clamp(38px,6vw,56px);letter-spacing:-.04em;line-height:1}
.starbox .ctr span{font-size:13px;color:#B7C1FF;margin-top:4px}
.starbox.lt .ctr span{color:var(--mut)}
.starbox.lt .ctr b{color:var(--ink)}
.prog-arc{transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)}

/* materi */
.bab{display:flex;flex-direction:column;gap:10px;text-align:left;border:1px solid var(--line);background:var(--sf);border-radius:20px;padding:20px;min-height:170px;transition:border-color .15s,transform .15s}
.bab:hover{border-color:var(--brand);transform:translateY(-2px)}
.bab .no{font-family:var(--fd);font-weight:800;font-size:15px;color:var(--tq)}
.bab h3{font-size:19px}
.bab .ft{margin-top:auto;display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:14px}
.article{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;align-items:start}
.article .txt p{max-width:64ch;margin-top:12px}
.article ul{padding-left:0;list-style:none;margin:14px 0 0}
.article li{padding:11px 0 11px 30px;border-top:1px solid var(--line);position:relative}
.article li::before{content:"";position:absolute;left:4px;top:19px;width:10px;height:10px;background:var(--tq);transform:rotate(45deg)}
.dalil{background:var(--hero);color:#fff;border-radius:24px;padding:26px}
.dalil .ar{font-size:30px;color:#fff}
.dalil .src{color:var(--gold);font-weight:700;margin-top:14px}
.dalil .idn{color:#C9D1FF;margin-top:6px;font-size:15px}

/* tugas */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{height:38px;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:var(--sf);font-weight:600;font-size:14px}
.tabs button[aria-pressed="true"]{background:var(--brand);color:var(--onbrand);border-color:var(--brand)}
.task{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--sf);border-radius:18px;padding:18px 20px}
.task:hover{border-color:var(--brand)}
.task h3{font-size:18px}
.task .sub{color:var(--mut);font-size:14px}
textarea{width:100%;min-height:150px;border-radius:14px;border:1.5px solid var(--line);background:var(--sf);padding:14px;resize:vertical;line-height:1.5}
textarea:focus{border-color:var(--brand);outline:none}
.fb{background:var(--goldbg);border-radius:14px;padding:14px 16px;margin-top:14px}

/* kuis */
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--sf);border-radius:14px;padding:14px 16px;margin-top:10px;font-size:16px}
.opt:hover:not([disabled]){border-color:var(--brand)}
.opt .l{width:30px;height:30px;border-radius:50%;background:var(--sf2);display:grid;place-items:center;font-weight:700;flex:none;font-size:14px}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--rose);background:var(--rosebg)}
.opt[disabled]{cursor:default}
.bar{height:8px;background:var(--sf2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--tq);border-radius:99px;transition:width .4s}

/* nilai */
.cmp{display:grid;grid-template-columns:110px 1fr 54px;gap:6px 14px;align-items:center;margin-top:16px}
.track{position:relative;height:22px;background:var(--sf2);border-radius:8px}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:var(--brand)}
.track u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--rose);text-decoration:none}
.track em{position:absolute;left:0;bottom:-3px;height:4px;background:var(--gold);border-radius:4px}
table{border-collapse:collapse;width:100%}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:15px;white-space:nowrap}
th{font-size:13px;color:var(--mut);font-weight:600;background:var(--sf2)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--sf)}
td input{width:66px;height:36px;border-radius:9px;border:1.5px solid var(--line);background:var(--sf);text-align:center}
td.sticky,th.sticky{position:sticky;left:0;background:var(--sf);z-index:1}
th.sticky{background:var(--sf2)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-top:14px}
.legend span::before{content:"";display:inline-block;width:12px;height:8px;border-radius:3px;margin-right:6px;background:var(--brand)}
.legend .g::before{background:var(--gold)}
.legend .r::before{background:var(--rose);width:3px;height:14px;vertical-align:-3px}
input[type=text].plain,select.plain{height:46px;width:100%;border-radius:12px;border:1.5px solid var(--line);background:var(--sf);padding:0 14px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:50;max-width:90%}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:900px){
  .login{grid-template-columns:1fr}
  .art{min-height:250px;padding:26px}
  .art .spin{top:50%;width:min(70%,240px)}
  .art .big{top:50%;font-size:72px}
  .art .cap{display:none}
  .panel{padding:28px 22px 40px}
  .app{grid-template-columns:1fr}
  .side{display:none}
  .main{padding:18px 16px calc(96px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--hero);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;color:#C3CBFF;font-size:11px;font-weight:600;padding:6px 0;border-radius:12px}
  .tabbar button[aria-current="page"]{color:#241A00;background:var(--gold)}
  .hero{grid-template-columns:1fr;padding:26px 22px}
  .starbox{max-width:200px;order:-1;margin:0}
  .grid2,.grid3,.article{grid-template-columns:1fr}
  .mtop{display:flex}
}
.mtop{display:none}
@media (max-width:900px){.mtop{display:inline-flex}}
@media (prefers-reduced-motion:reduce){
  .art .s1,.art .s2{animation:none}
  .prog-arc,.bar i,.toast{transition:none}
}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
/* =====================================================
   DATA KURIKULUM
===================================================== */
const KKM = 75;
const W = { tugas: 25, kuis: 20, pts: 20, pas: 25, sikap: 10 };
const SALAT = [["Subuh","04:35"],["Zuhur","11:56"],["Asar","15:09"],["Magrib","17:58"],["Isya","19:07"]];

const NAMES = ["Ahmad Fauzan","Aisyah Putri","Alya Rahmawati","Bagas Prasetyo","Bilqis Azzahra","Cahya Ramadhan","Dafa Alfarizi","Dinda Maharani","Eka Saputra","Farhan Maulana","Fatimah Azzahra","Gilang Permana","Hafizh Ramadhani","Intan Permatasari","Izzat Kamil","Jihan Nabila","Kevin Ardiansyah","Khoirunnisa","Lutfi Hakim","Maulida Safitri","Naufal Rizky","Nayla Zahira","Okta Pratama","Putri Amelia","Qonita Salsabila","Rafi Hidayat","Salsabila Nuraini","Tegar Wicaksono","Ulya Fadhilah","Vino Aditya","Wulan Anggraini","Zidan Kurniawan"];

const BAB = [
 { id:"b1", t:"Iman kepada Malaikat Allah", m:8,
   ringkas:["Beriman kepada malaikat berarti meyakini bahwa Allah menciptakan makhluk gaib dari cahaya yang selalu taat dan tidak pernah durhaka. Malaikat tidak makan, tidak minum, dan tidak memiliki hawa nafsu.","Ada sepuluh malaikat yang wajib kita ketahui beserta tugasnya. Keyakinan ini membuat kita merasa selalu diawasi, sehingga terbiasa jujur walaupun sedang sendirian."],
   poin:["Jibril menyampaikan wahyu kepada para nabi.","Mikail mengatur rezeki, termasuk menurunkan hujan.","Israfil meniup sangkakala pada hari kiamat.","Izrail mencabut nyawa makhluk.","Munkar dan Nakir menanyai manusia di alam kubur.","Raqib mencatat amal baik dan Atid mencatat amal buruk.","Malik menjaga neraka dan Ridwan menjaga surga."],
   dalil:{ ar:"كُلٌّ آمَنَ بِاللَّهِ وَمَلَائِكَتِهِ وَكُتُبِهِ وَرُسُلِهِ", src:"QS. Al-Baqarah: 285 (potongan)", id:"Semuanya beriman kepada Allah, malaikat-malaikat-Nya, kitab-kitab-Nya, dan rasul-rasul-Nya." },
   fakta:"Dalam hadis yang terkenal, Jibril pernah datang kepada Rasulullah ﷺ dalam rupa seorang laki-laki berpakaian putih bersih untuk menanyakan tentang iman, Islam, dan ihsan." },
 { id:"b2", t:"Salat Sunah dan Sujud", m:9,
   ringkas:["Salat sunah adalah salat yang dianjurkan tetapi tidak wajib. Mengerjakannya mendapat pahala, dan meninggalkannya tidak berdosa. Salat sunah menyempurnakan kekurangan pada salat fardu kita.","Ada yang dikerjakan sendiri seperti rawatib, duha, dan tahajud, ada pula yang dikerjakan berjamaah seperti salat Id. Selain itu kita mengenal tiga sujud: syukur, tilawah, dan sahwi."],
   poin:["Rawatib adalah salat sunah yang mengiringi salat fardu, sebelum atau sesudahnya.","Duha dikerjakan setelah matahari naik hingga menjelang Zuhur, paling sedikit dua rakaat.","Tahajud dikerjakan setelah bangun tidur pada malam hari, paling baik di sepertiga malam terakhir.","Salat Id (Idulfitri dan Iduladha) dikerjakan berjamaah dua rakaat.","Sujud syukur dilakukan ketika mendapat nikmat atau terhindar dari bahaya.","Sujud tilawah dilakukan ketika membaca atau mendengar ayat sajdah.","Sujud sahwi dilakukan untuk menutup kekeliruan di dalam salat."],
   dalil:{ ar:"إِنَّ الصَّلَاةَ تَنْهَىٰ عَنِ الْفَحْشَاءِ وَالْمُنكَرِ", src:"QS. Al-Ankabut: 45 (potongan)", id:"Sesungguhnya salat itu mencegah dari perbuatan keji dan mungkar." },
   fakta:"Salat rawatib sering disebut sebagai penambal kekurangan salat fardu, seperti cadangan yang menyempurnakan yang utama." },
 { id:"b3", t:"Akhlak Terpuji: Husnuzan dan Tawaduk", m:7,
   ringkas:["Akhlak terpuji adalah perilaku baik yang lahir dari hati yang bersih. Husnuzan berarti berprasangka baik kepada Allah, kepada diri sendiri, dan kepada sesama.","Tawaduk berarti rendah hati, yaitu mau mengakui kelebihan orang lain dan tidak membanggakan diri. Lawannya adalah takabur atau sombong."],
   poin:["Husnuzan membuat hubungan pertemanan lebih tenang dan jauh dari curiga.","Contoh husnuzan: tidak langsung menuduh teman yang terlambat membalas pesan.","Tawaduk bukan berarti rendah diri. Kita tetap percaya diri tetapi tidak pamer.","Contoh tawaduk: berterima kasih saat dipuji dan tetap mau belajar dari siapa saja.","Takabur adalah menolak kebenaran dan meremehkan orang lain."],

function h(n,k){ const x = Math.sin(n*127.1 + k*311.7) * 43758.5453; return x - Math.floor(x); }
function seed(){
  const students = NAMES.map((nama,i)=>({ no:i+1, nama, pts:Math.round(68+h(i+1,1)*30), pas:null, sikap:Math.round(80+h(i+1,2)*18), hadir:Math.round(88+h(i+1,3)*12) }));
  const base = Date.now();
  const subs = {};
  students.forEach(s=>{
    ["t1","t2"].forEach((t,j)=>{
      if (h(s.no,10+j) > 0.08) subs[t+"_"+s.no] = { text:"Dikumpulkan.", at: base - (10-j*3)*864e5, score: Math.round(72+h(s.no,20+j)*27), fb:"" };
    });
  });
  return { base, students, subs, quiz:{}, done:{}, ann:[
    { id:"a1", t:"Kuis Bab 1 sudah dibuka", b:"Kerjakan di menu Evaluasi. Boleh diulang, nilai tertinggi yang dipakai.", at: base - 864e5 },

  ]};
}

function starPts(cx,cy,R){ const r=R*0.7654, p=[]; for(let k=0;k<16;k++){ const a=(-90+k*22.5)*Math.PI/180, rr=k%2?r:R; p.push([cx+rr*Math.cos(a),cy+rr*Math.sin(a)]); } return p; }
function starPath(cx,cy,R){ return "M"+starPts(cx,cy,R).map(p=>p[0].toFixed(1)+" "+p[1].toFixed(1)).join("L")+"Z"; }
function starRing(pct, track, color){
  const d = starPath(110,110,98);
  return `<svg viewBox="0 0 220 220" aria-hidden="true"><path d="${d}" fill="none" stroke="${track}" stroke-width="9" stroke-linejoin="round"/><path class="prog-arc" data-pct="${pct}" d="${d}" pathLength="100" fill="none" stroke="${color}" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="100" stroke-dashoffset="100"/></svg>`;
}
function animateArcs(){ requestAnimationFrame(()=>requestAnimationFrame(()=>{ document.querySelectorAll(".prog-arc").forEach(el=>{ el.style.strokeDashoffset = 100 - Math.max(0,Math.min(100,+el.dataset.pct)); }); })); }

const lattice = `<svg class="lattice" width="100%" height="100%" aria-hidden="true"><defs><pattern id="pt" width="64" height="64" patternUnits="userSpaceOnUse"><path d="${starPath(32,32,24)}" fill="none" stroke="#fff" stroke-width="1"/></pattern></defs><rect width="100%" height="100%" fill="url(#pt)"/></svg>`;

const stu = no => DB.students.find(s=>s.no===no);
const sub = (t,no) => DB.subs[t+"_"+no];
function tugasAvg(no){ return avg(TASKS.map(t=>sub(t.id,no)).filter(x=>x&&x.score!=null).map(x=>x.score)); }
function kuisAvg(no){ const q = DB.quiz[no]||{}; return avg(Object.values(q).map(x=>x.best)); }
function comps(no){ const s=stu(no); return { tugas:tugasAvg(no), kuis:kuisAvg(no), pts:s.pts, pas:s.pas, sikap:s.sikap }; }
function finalScore(no){
  const c = comps(no); let sum=0, w=0;
  Object.keys(W).forEach(k=>{ if(c[k]!=null){ sum+=c[k]*W[k]; w+=W[k]; } });
  return w? sum/w : null;
}
function predikat(v){ if(v==null) return {k:"–",t:"Belum ada nilai",c:""}; if(v>=90) return {k:"A",t:"Sangat baik",c:"ok"}; if(v>=80) return {k:"B",t:"Baik",c:"ok"}; if(v>=KKM) return {k:"C",t:"Cukup, sudah tuntas",c:"warn"}; return {k:"D",t:"Perlu remedial",c:"bad"}; }
function classAvg(key){ return avg(DB.students.map(s=> key==="final"?finalScore(s.no):comps(s.no)[key]).filter(v=>v!=null)); }
function progress(no){
  const done=(DB.done[no]||[]).length, sb=TASKS.filter(t=>sub(t.id,no)).length, qz=Object.keys(DB.quiz[no]||{}).length;
  return Math.round((done+sb+qz)/(BAB.length+TASKS.length+BAB.length)*100);
}
function taskStatus(t,no){
  const s=sub(t.id,no);
  if(!s) return dueAt(t)<Date.now() ? {k:"late",l:"Belum dikumpulkan",c:"bad"} : {k:"todo",l:"Belum dikerjakan",c:"warn"};
  if(s.score!=null) return {k:"graded",l:"Dinilai "+s.score,c:"ok"};
  return {k:"sent",l:"Menunggu penilaian",c:"info"};
}
function nextSalat(){
  const now=new Date(), m=now.getHours()*60+now.getMinutes();
  for(const [n,t] of SALAT){ const [hh,mm]=t.split(":").map(Number); const x=hh*60+mm; if(x>m) return {n,t,d:x-m}; }
  const [hh,mm]=SALAT[0][1].split(":").map(Number); return {n:SALAT[0][0],t:SALAT[0][1],d:1440-m+hh*60+mm};
}
function salatText(){ const s=nextSalat(); const j=Math.floor(s.d/60), mnt=s.d%60; return `${s.n} ${s.t}, ${j>0?j+" jam ":""}${mnt} menit lagi`; }

      ${lattice}
      <div class="spin">
        <svg class="s1" viewBox="0 0 220 220"><path d="${starPath(110,110,104)}" fill="none" stroke="#F2B233" stroke-width="1.6"/></svg>
        <svg class="s2" viewBox="0 0 220 220"><path d="${starPath(110,110,80)}" fill="none" stroke="#7DE0DA" stroke-width="1.2"/><path d="${starPath(110,110,56)}" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1"/></svg>
      </div>
      <div class="big">8A</div>
      <div class="cap"><h1>Belajar PAI, satu bintang setiap langkah.</h1><p>Materi, tugas, kuis, dan nilai Pendidikan Agama Islam kelas 8A ada di satu tempat.</p></div>
    </section>
    <section class="panel">
      <h2>Masuk ke Bintang 8A</h2>
      <p class="lead">Gunakan namamu dan nomor absen di daftar kelas.</p>
      <form id="lf" novalidate>
        <div class="field"><label for="nm">Nama</label><input id="nm" name="nm" type="text" autocomplete="off" placeholder="Contoh: Aisyah Putri"><small>Nama lengkap atau nama depan saja.</small></div>
        <div class="field"><label for="ab">Nomor absen</label><input id="ab" name="ab" type="number" inputmode="numeric" min="0" max="32" placeholder="Contoh: 2"></div>
        <div class="err" id="err" role="alert"></div>
        <button class="btn" type="submit" style="width:100%">Masuk</button>
      </form>
      <details class="roster"><summary>Lupa nomor absen? Lihat daftar kelas</summary><div class="grid">${roster}</div></details>
      <p class="hint">Guru masuk dengan nama “Guru PAI” dan nomor absen 0. Data pada versi contoh ini tersimpan di browser perangkat ini.</p>
    </section>
  </main>`;
  $("#lf").addEventListener("submit", e=>{
    e.preventDefault();
    const n = norm($("#nm").value), no = $("#ab").value.trim();
    const err = $("#err");
    if(n.length<3){ err.textContent="Isi namamu dulu, minimal 3 huruf."; $("#nm").focus(); return; }
    if(no===""){ err.textContent="Isi nomor absenmu."; $("#ab").focus(); return; }
    const num = +no;
    if(num===0){
      if(n.includes("guru")){ ME={teacher:true,nama:"Guru PAI"}; sessSet(0); view="t_ring"; render(); return; }
      err.textContent="Nomor absen 0 khusus untuk guru. Gunakan nama “Guru PAI”."; return;
    }
    const s = stu(num);
    if(!s){ err.textContent="Nomor absen "+num+" tidak ada. Nomor absen kelas 8A adalah 1 sampai "+DB.students.length+"."; return; }
    if(!norm(s.nama).includes(n)){ err.textContent="Nama tidak cocok dengan nomor absen "+num+". Periksa lagi ejaannya atau buka daftar kelas."; return; }
    ME=s; sessSet(s.no); view="beranda"; subv=null; qz=null; render(); toast("Selamat datang, "+s.nama.split(" ")[0]+".");
  });
}

function renderView(){

/* =====================================================

function tRing(){
  const st=DB.students, fins=st.map(s=>({s,f:finalScore(s.no)}));
  const valid=fins.filter(x=>x.f!=null), a=avg(valid.map(x=>x.f));
  const below=valid.filter(x=>x.f<KKM);
  const dist={A:0,B:0,C:0,D:0}; valid.forEach(x=>dist[predikat(x.f).k]++);
  const mx=Math.max(1,...Object.values(dist));
  const sentAll=TASKS.map(t=>({t,n:st.filter(s=>sub(t.id,s.no)).length}));
  return `
  <div class="grid3" style="margin-bottom:18px">
    <div class="card"><div class="mut">Rata-rata nilai kelas</div><h2 style="font-size:44px;margin-top:4px">${r1(a)}</h2></div>
    <div class="card"><div class="mut">Siswa di bawah KKM ${KKM}</div><h2 style="font-size:44px;margin-top:4px;color:${below.length?"var(--rose)":"var(--ok)"}">${below.length}</h2></div>
    <div class="card"><div class="mut">Jumlah siswa</div><h2 style="font-size:44px;margin-top:4px">${st.length}</h2></div>
  </div>
  <div class="grid2">
    <div class="card"><h3>Sebaran predikat</h3>${Object.entries(dist).map(([k,v])=>`<div class="row" style="margin:10px 0"><b style="width:22px">${k}</b><div class="bar" style="flex:1;height:14px"><i style="width:${v/mx*100}%;background:${k==="D"?"var(--rose)":k==="C"?"var(--gold)":"var(--tq)"}"></i></div><span style="width:28px;text-align:right">${v}</span></div>`).join("")}</div>
    <div class="card"><h3>Pengumpulan tugas</h3>${sentAll.map(x=>`<div style="margin:12px 0"><div class="row between" style="font-size:15px"><span>${esc(x.t.t)}</span><b>${x.n}/${st.length}</b></div><div class="bar" style="margin-top:6px"><i style="width:${x.n/st.length*100}%"></i></div></div>`).join("")}</div>
    <div class="card" style="grid-column:1/-1"><h3>Perlu perhatian</h3>${below.length?`<div class="row" style="flex-wrap:wrap;gap:8px">${below.map(x=>`<span class="pill bad">${x.s.no}. ${esc(x.s.nama)} (${Math.round(x.f)})</span>`).join("")}</div>`:`<div class="empty">Semua siswa yang sudah bernilai mencapai KKM.</div>`}</div>
  </div>`;
}
function tRekap(){
  return `<p class="mut" style="margin:-8px 0 16px">Ubah nilai PTS, PAS, atau sikap langsung pada tabel. Perubahan tersimpan otomatis.</p>
  <div class="scroll"><table><thead><tr><th class="sticky">No</th><th>Nama</th><th>Tugas</th><th>Kuis</th><th>PTS</th><th>PAS</th><th>Sikap</th><th>Hadir</th><th>Akhir</th><th>Predikat</th></tr></thead><tbody>
  ${DB.students.map(s=>{const c=comps(s.no),f=finalScore(s.no),p=predikat(f);return `<tr>
    <td class="sticky">${s.no}</td><td>${esc(s.nama)}</td><td>${r1(c.tugas)}</td><td>${r1(c.kuis)}</td>
    <td><input type="number" min="0" max="100" value="${s.pts??""}" data-field="pts" data-no="${s.no}" aria-label="PTS ${esc(s.nama)}"></td>
    <td><input type="number" min="0" max="100" value="${s.pas??""}" data-field="pas" data-no="${s.no}" aria-label="PAS ${esc(s.nama)}"></td>
    <td><input type="number" min="0" max="100" value="${s.sikap??""}" data-field="sikap" data-no="${s.no}" aria-label="Sikap ${esc(s.nama)}"></td>
    <td>${s.hadir}%</td><td><b id="fin${s.no}">${r1(f)}</b></td><td><span class="pill ${p.c}" id="pr${s.no}">${p.k}</span></td></tr>`}).join("")}
  </tbody></table></div>`;
}
function tTugas(){
  const cur = tSel || TASKS[TASKS.length>2?2:0].id;
  const t = TASKS.find(x=>x.id===cur);
  return `
  <div class="field" style="margin:-4px 0 18px;max-width:460px"><label for="tsel">Pilih tugas</label><select id="tsel" class="plain" data-change="tsel">${TASKS.map(x=>`<option value="${x.id}" ${x.id===cur?"selected":""}>${esc(x.t)}</option>`).join("")}</select></div>
  <div class="stack">${DB.students.map(s=>{const x=sub(t.id,s.no);return `
    <div class="card" style="padding:16px 20px">
      <div class="row between" style="flex-wrap:wrap"><b>${s.no}. ${esc(s.nama)}</b>${x?`<span class="pill ${x.score!=null?"ok":"info"}">${x.score!=null?"Dinilai "+x.score:"Perlu dinilai"}</span>`:`<span class="pill bad">Belum mengumpulkan</span>`}</div>
      ${x?`<p class="mut" style="margin:8px 0;white-space:pre-wrap;font-size:15px">${esc(x.text)}</p>
      <div class="row" style="flex-wrap:wrap;gap:10px"><input id="sc_${t.id}_${s.no}" type="number" min="0" max="100" value="${x.score??""}" placeholder="Nilai" aria-label="Nilai ${esc(s.nama)}" style="width:90px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--sf);text-align:center"><input id="fb_${t.id}_${s.no}" type="text" class="plain" value="${esc(x.fb||"")}" placeholder="Catatan untuk siswa" style="flex:1;min-width:180px;height:40px"><button class="btn sm" data-act="grade" data-t="${t.id}" data-no="${s.no}">Simpan</button></div>`:""}
    </div>`}).join("")}</div>`;
}
function tInfo(){
  const anns=[...DB.ann].sort((a,b)=>b.at-a.at);
  return `<div class="grid2">
    <div class="card"><h3>Tulis pengumuman</h3>
      <div class="field" style="margin-top:0"><label for="at">Judul</label><input id="at" type="text" class="plain" placeholder="Contoh: Remedial Bab 1"></div>
      <div class="field"><label for="ab2">Isi</label><textarea id="ab2" style="min-height:110px" placeholder="Tulis pesan untuk kelas 8A"></textarea></div>
      <button class="btn" style="margin-top:14px" data-act="postann">Kirim ke kelas</button></div>
    <div class="card"><h3>Pengumuman aktif</h3><div class="stack">${anns.length?anns.map(a=>`<div class="row between" style="align-items:flex-start;padding-top:12px;border-top:1px solid var(--line)"><div><b>${esc(a.t)}</b><p class="mut" style="font-size:15px">${esc(a.b)}</p></div><button class="btn ghost sm" data-act="delann" data-id="${a.id}">Hapus</button></div>`).join(""):`<div class="empty">Belum ada pengumuman.</div>`}</div></div>
  </div>`;
}

/* =====================================================
   EVENT
===================================================== */
document.addEventListener("click", e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act, d=el.dataset;
  if(a==="fill"){ const s=stu(+d.no); $("#nm").value=s.nama; $("#ab").value=s.no; $("#err").textContent=""; $("#nm").scrollIntoView({block:"center"}); }
  else if(a==="go") go(d.v);
  else if(a==="logout"){ ME=null; sessSet(null); subv=null; qz=null; render(); }
  else if(a==="openbab") go("materi",d.id);
  else if(a==="opentask") go("tugas",d.id);
  else if(a==="toggledone"){ const l=DB.done[ME.no]||(DB.done[ME.no]=[]); const i=l.indexOf(d.id); i>=0?l.splice(i,1):l.push(d.id); save(); renderView(); toast(i>=0?"Tanda selesai dibatalkan.":"Materi ditandai selesai."); }
  else if(a==="tfilter"){ tfilter=d.k; renderView(); }
  else if(a==="submittask"){
    const v=$("#ans").value.trim();
    if(v.length<5){ toast("Jawabanmu masih kosong. Tulis dulu atau tempel tautan."); $("#ans").focus(); return; }
    const key=d.id+"_"+ME.no, old=DB.subs[key];
    DB.subs[key]={text:v,at:Date.now(),score:null,fb:old?old.fb:""}; save(); renderView(); toast(old?"Jawaban diperbarui.":"Tugas terkumpul.");
  }
  else if(a==="startquiz"){ qz={bab:d.id,i:0,sel:null,score:0,ans:[],fin:false}; view="evaluasi"; subv=null; renderView(); window.scrollTo({top:0}); }
  else if(a==="quizexit"){ qz=null; renderView(); }
  else if(a==="pick"){
    if(qz.sel!=null) return; const Q=QUIZ[qz.bab]; qz.sel=+d.i; qz.ans[qz.i]=qz.sel; if(qz.sel===Q[qz.i].a) qz.score++; renderView();
  }
  else if(a==="qnext"){
    const Q=QUIZ[qz.bab];
    if(qz.i>=Q.length-1){
      qz.fin=true; const pct=Math.round(qz.score/Q.length*100);
      const all=DB.quiz[ME.no]||(DB.quiz[ME.no]={}); const prev=all[qz.bab];
      all[qz.bab]={best:Math.max(prev?prev.best:0,pct),last:pct,at:Date.now()}; save();
    } else { qz.i++; qz.sel=null; }
    renderView(); window.scrollTo({top:0});
  }
  else if(a==="grade"){
    const sc=$("#sc_"+d.t+"_"+d.no).value, fb=$("#fb_"+d.t+"_"+d.no).value.trim(), x=DB.subs[d.t+"_"+d.no];
    if(sc===""||+sc<0||+sc>100){ toast("Isi nilai antara 0 sampai 100."); return; }
    x.score=Math.round(+sc); x.fb=fb; save(); tSel=d.t; renderView(); toast("Nilai tersimpan.");
  }
  else if(a==="postann"){
    const t=$("#at").value.trim(), b=$("#ab2").value.trim();
    if(!t||!b){ toast("Judul dan isi pengumuman harus diisi."); return; }
    DB.ann.push({id:"a"+Date.now(),t,b,at:Date.now()}); save(); renderView(); toast("Pengumuman terkirim.");
  }
  else if(a==="delann"){ DB.ann=DB.ann.filter(x=>x.id!==d.id); save(); renderView(); toast("Pengumuman dihapus."); }
});
document.addEventListener("change", e=>{
  const el=e.target;
  if(el.dataset.field){
    const s=stu(+el.dataset.no); const v=el.value===""?null:Math.max(0,Math.min(100,Math.round(+el.value)));
    s[el.dataset.field]=v; save();
    const f=finalScore(s.no), p=predikat(f);
    $("#fin"+s.no).textContent=r1(f); const pe=$("#pr"+s.no); pe.textContent=p.k; pe.className="pill "+p.c;
    toast("Nilai "+s.nama.split(" ")[0]+" diperbarui.");
  }
  if(el.dataset.change==="tsel"){ tSel=el.value; renderView(); }
});

boot();
</script>
